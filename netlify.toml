[build]
  publish = "."

# newaddy.ai is the destination (FavAtlas). Do not attach it here or the splash loops.
# Attach the TLD aliases below in Netlify → Domain management.

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200
  conditions = { Host = ["newaddy.app", "www.newaddy.app", "newaaddy.app", "www.newaaddy.app"] }

